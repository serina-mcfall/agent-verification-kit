name: verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The kit's own controls. If these do not run in CI, the kit is asking adopters
  # to trust a suite whose last known state was on the author's laptop.
  controls:
    # NO COUNT IN THIS NAME. It said "controls (357)" for one commit, and by the
    # time the first pull request displayed it the suites held 362. A number in a
    # label that nothing updates is a stale claim printed with authority — the same
    # defect class this kit spends its comments on. The suites report their own
    # totals; that number is derived from running them, not typed.
    name: controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: jq is present
        # guard-test-changes.sh and the stamp hooks parse their payloads with jq, and both
        # announce non-enforcement rather than blocking when it is missing. So a
        # runner without jq would run these suites against hooks that are quietly
        # standing aside — green, and measuring nothing.
        run: jq --version

      # THE SUITE LIST LIVES IN ONE PLACE, AND IT IS NOT THIS FILE.
      #
      # This step used to be two, and between them they carried the list of
      # suites TWICE — once in a staleness guard and once in the loop that ran
      # them. Two copies of one list, in one file, with nothing checking they
      # agreed: exactly the drift this kit's README names as its most recurrent
      # defect, sitting in the workflow that is supposed to catch it.
      #
      # check-controls.sh now owns the list, in plugins/agent-verification-kit/
      # hooks/controls.list, and does the same two-directional check it always
      # did — an unlisted test-*.sh fails the run, and a listed file that does
      # not exist fails the run. A local run and CI can no longer disagree,
      # because they are the same command.
      #
      # The runner has its own controls in test-check-controls.sh, including one
      # asserting that a missing or empty list FAILS rather than quietly running
      # zero suites and reporting green.
      - name: controls
        run: bash plugins/agent-verification-kit/hooks/check-controls.sh

  undeclared-test-changes:
    name: undeclared test changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # NOT OPTIONAL. On a shallow clone the base ref does not resolve, the
          # diff comes back empty, and an empty diff is indistinguishable from
          # "no tests were touched". check-test-changes.sh exits 3 rather than 0
          # in that case, so the job fails loudly instead of passing — but the
          # right fix is to fetch the history, not to tolerate exit 3.
          fetch-depth: 0

      - name: refuse undeclared test changes
        run: |
          bash plugins/agent-verification-kit/hooks/check-test-changes.sh \
            "origin/${{ github.event.pull_request.base.ref }}"

  flaky-trailers:
    name: declared flakes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # Same reason as the job above: a shallow clone yields an empty commit
          # list, which looks exactly like a branch declaring no flakes.
          fetch-depth: 0

      # A SEPARATE JOB SO THE DECLARED FLAKES ARE VISIBLE IN THE CHECKS LIST,
      # not buried in another job's log. The whole point of the trailer is that
      # a second person sees it; folding this into the job above would satisfy
      # the letter of that and none of it.
      #
      # This job CANNOT detect a MISSING trailer — by the time it runs, the stamp
      # that knew a run was flaky is gone. verify-gate is the only place that can,
      # and does. Read the header of the script before claiming otherwise.
      - name: validate and report declared flakes
        run: |
          bash plugins/agent-verification-kit/hooks/check-flaky-trailers.sh \
            "origin/${{ github.event.pull_request.base.ref }}"
