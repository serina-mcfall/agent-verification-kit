name: verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The kit's own controls. If these do not run in CI, the kit is asking adopters
  # to trust a suite whose last known state was on the author's laptop.
  controls:
    # NO COUNT IN THIS NAME. It said "controls (357)" for one commit, and by the
    # time the first pull request displayed it the suites held 362. A number in a
    # label that nothing updates is a stale claim printed with authority — the same
    # defect class this kit spends its comments on. The suites report their own
    # totals; that number is derived from running them, not typed.
    name: controls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: jq is present
        # test-guard.sh and the stamp hooks parse their payloads with jq, and both
        # announce non-enforcement rather than blocking when it is missing. So a
        # runner without jq would run these suites against hooks that are quietly
        # standing aside — green, and measuring nothing.
        run: jq --version

      - name: every suite is in the list below
        working-directory: plugins/agent-verification-kit/hooks
        # THE LIST IS EXPLICIT AND THEREFORE GOES STALE. It was already stale once:
        # test-edit-tracker-notebook.sh was written, committed, and never added
        # here, so CI ran nine suites while the repository held ten. A control that
        # exists and never runs is worth less than no control, because its presence
        # is counted as coverage.
        #
        # A bare `test-*.sh` glob is not the answer either: test-guard.sh and
        # test-patterns.sh are IMPLEMENTATION files whose names begin with `test-`,
        # so a glob runs them as suites and they exit 0 having asserted nothing.
        # That naming is a defect in its own right and is recorded separately.
        #
        # So the list stays explicit and this step fails when reality diverges from
        # it. Every test-*.sh file must be either a listed suite or a named
        # implementation file — nothing may be silently neither.
        run: |
          set -euo pipefail
          # A `case` against " $listed " was the first attempt and it was WRONG:
          # the list spans several lines, so a filename ending a line is followed
          # by a newline rather than a space and never matched. It reported three
          # listed suites as unlisted. Membership by loop is whitespace-proof.
          listed="test-stamp-path.sh test-verify-gate.sh test-verify-gate-portability.sh
                  test-post-bash.sh test-edit-tracker.sh test-edit-tracker-notebook.sh
                  test-check-models.sh test-test-patterns.sh test-test-guard.sh
                  test-check-test-changes.sh"
          impl="test-guard.sh test-patterns.sh"
          in_list() { local n="$1"; shift; local x; for x in "$@"; do [ "$x" = "$n" ] && return 0; done; return 1; }
          status=0
          for f in test-*.sh; do
            in_list "$f" $listed $impl \
              || { echo "::error title=unlisted suite::$f is neither a listed suite nor a named implementation file"; status=1; }
          done
          for f in $listed; do
            [ -f "$f" ] || { echo "::error title=missing suite::$f is listed but does not exist"; status=1; }
          done
          [ "$status" = 0 ] && echo "10 suites listed, 2 implementation files named, nothing unaccounted for"
          exit "$status"

      - name: controls
        working-directory: plugins/agent-verification-kit/hooks
        run: |
          set -euo pipefail
          fail=0
          for suite in \
            test-stamp-path.sh \
            test-verify-gate.sh \
            test-verify-gate-portability.sh \
            test-post-bash.sh \
            test-edit-tracker.sh \
            test-edit-tracker-notebook.sh \
            test-check-models.sh \
            test-test-patterns.sh \
            test-test-guard.sh \
            test-check-test-changes.sh
          do
            echo "::group::$suite"
            if bash "$suite"; then
              echo "PASS $suite"
            else
              echo "::error title=$suite::controls failed"
              fail=1
            fi
            echo "::endgroup::"
          done
          # EVERY SUITE RUNS BEFORE ANYTHING FAILS THE JOB. Exiting on the first
          # failure tells you one thing; running them all tells you whether the
          # breakage is local or general, which is the more useful answer when a
          # shared library like test-patterns.sh regresses.
          exit "$fail"

  # The CI half of the test-modification guard, applied to this repository.
  undeclared-test-changes:
    name: undeclared test changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          # NOT OPTIONAL. On a shallow clone the base ref does not resolve, the
          # diff comes back empty, and an empty diff is indistinguishable from
          # "no tests were touched". check-test-changes.sh exits 3 rather than 0
          # in that case, so the job fails loudly instead of passing — but the
          # right fix is to fetch the history, not to tolerate exit 3.
          fetch-depth: 0

      - name: refuse undeclared test changes
        run: |
          bash plugins/agent-verification-kit/hooks/check-test-changes.sh \
            "origin/${{ github.event.pull_request.base.ref }}"
